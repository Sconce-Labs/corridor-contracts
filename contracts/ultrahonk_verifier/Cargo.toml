[package]
name = "ultrahonk-verifier"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "UltraHonk proof verifier for Corridor — implements corridor_types::Verifier (M3, skeleton)"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
corridor-types = { path = "../../crates/corridor_types" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
