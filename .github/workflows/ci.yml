name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: fmt + clippy + test + wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy
      # SDK 28 refuses to cross-compile without a spec-shaking-aware build
      # system; `stellar contract build` is the supported path for the
      # ultrahonk-verifier (soroban-sdk 28). SDK 25 contracts keep plain cargo.
      - uses: stellar/stellar-cli@300aaf69ab100536678bdb641428b06f06b318ea # v28.0.0
        with:
          version: v28.0.0
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      # TODO(M3 step 2): drop the --skip once tests/circuits/simple_circuit
      # fixtures (proof/vk/public_inputs, barretenberg 0.87.0) are committed;
      # the skipped transcript test consumes those artifacts.
      - name: Unit tests (host)
        run: cargo test --workspace --locked -- --skip transcript::tests::test_transcript_determinism
      - name: Contract wasm build (SDK 25 contracts)
        run: >
          cargo build --locked --release --target wasm32v1-none
          -p corridor-registry -p corridor-attestation
          -p verifier-mock
      - name: Contract wasm build (ultrahonk verifier, SDK 28)
        run: stellar contract build --package ultrahonk-verifier
      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: target/wasm32v1-none/release/*.wasm

  deny:
    name: cargo-deny (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check
