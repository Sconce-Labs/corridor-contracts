name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: fmt + clippy + test + wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Unit tests (host)
        run: cargo test --workspace --locked
      - name: Contract wasm build
        run: >
          cargo build --locked --release --target wasm32v1-none
          -p corridor-registry -p corridor-attestation
          -p verifier-mock -p ultrahonk-verifier
      - uses: actions/upload-artifact@v7
        with:
          name: wasm
          path: target/wasm32v1-none/release/*.wasm

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
