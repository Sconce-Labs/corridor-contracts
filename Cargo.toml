[workspace]
resolver = "2"
members = [
    "crates/corridor_types",
    "crates/poseidon_conformance",
    "contracts/corridor_registry",
    "contracts/corridor_attestation",
    "contracts/verifier_mock",
    "contracts/ultrahonk_verifier",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Sconce-Labs/corridor-contracts"

[workspace.dependencies]
soroban-sdk = "27.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
