[package]
name = "ultrahonk_soroban_verifier"
version = "0.1.0"
edition = "2021"
publish = false

# VENDORED — do not modify the Rust sources in src/.
# Source: NethermindEth/ultrahonk-rust-verifier @ 097da17df8b0b971d71885566034958a8caebab4
# (2026-09-22, post OpenZeppelin audit remediation). Upstream MIT; see LICENSE.
