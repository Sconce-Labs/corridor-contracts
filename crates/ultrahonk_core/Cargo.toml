# the workspace default 25.3 — the core needs SDK-28 host APIs), alloc enabled,
# publish off. Provenance of the verified equations: VERIFIER_PROVENANCE.md.
license     = "MIT"
description = "Rust verifier for UltraHonk proofs (vendored from rs-soroban-ultrahonk)"
repository  = "https://github.com/yugocabrio/rs-soroban-ultrahonk"

[dependencies]
soroban-sdk = { version = "28.0.0", default-features = false, features = ["alloc"] }

[dev-dependencies]
soroban-sdk = { version = "28.0.0", features = ["testutils", "alloc"] }
